<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Geo Quiz</title>
  <link rel="icon" type="image/png" href="images/earth.png">
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="main-content">
    <div id="map"> </div>
    <div class="sidebar">
      <div id="kids-mode-toggle" class="toggle-box" title="Easier map with visible labels 🧒">
        <label class="switch">
          <input type="checkbox" id="kidsModeCheckbox">
          <span class="slider round"></span>
        </label>
        <span class="toggle-label">Kids Mode</span>
      </div>
      <div id="reward-toggle" class="toggle-box" title="Every 3rd correct answer unlocks a cat gif 🐱">
        <label class="switch">
          <input type="checkbox" id="rewardCheckbox">
          <span class="slider round"></span>
        </label>
        <span class="toggle-label">Reward</span>
      </div>
      <div id="counters" class="counters">
        <p><span class="icon question">⁇</span> <span id="remaining">0</span></p>
        <p><span class="icon total">∑</span> <span id="total">0</span></p>
        <p><span class="icon correct">✓</span> <span id="correct">0</span></p>
        <p><span class="icon wrong">✘</span> <span id="wrong">0</span></p>
        <span id="feedback" class="feedback"></span>
      </div>
      <ul id="history"></ul>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>

</html>
